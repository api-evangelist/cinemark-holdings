x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    Cinemark's only developer surface is its Brazilian subsidiary's Sensedia portal at
    developers.cinemark.com.br, whose API list and interactive API Browser are served only
    to registered accounts — an anonymous GET of /api-portal/apis returns HTTP 403 "Acesso
    negado" — while the pages it does serve publicly are unmodified vendor template
    (Lorem ipsum terms and FAQ, Tumblr's OAuth endpoints on the auth page, Evernote's SDK
    copy), and the api.cinemark.com host returns HTTP 502 on every path.
