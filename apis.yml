description: >-
  Cinemark Holdings, Inc. (NYSE: CNK) is one of the largest motion picture exhibitors in
  the world, operating theatres across the United States and fifteen Latin American
  countries under the Cinemark, Century, Tinseltown, Rave and CineArts brands. Cinemark
  publishes no general-purpose public API and no machine-readable contract of any kind:
  as of September 2026 there is no OpenAPI, GraphQL SDL, AsyncAPI, agent card, MCP server
  or .well-known document on any Cinemark-controlled host. Its Brazilian subsidiary does
  operate a branded Sensedia developer portal at developers.cinemark.com.br, but the API
  list and interactive API Browser are gated behind developer registration and most of the
  portal's public pages remain unmodified vendor template content. Showtime, ticketing and
  loyalty integrations are delivered through partner agreements and third-party
  aggregators such as Fandango, Atom Tickets and Movio.
